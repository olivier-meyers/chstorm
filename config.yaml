# Every parameter needs a cited source. "TODO(Mx)" = value and citation to be filled in that milestone;
# nothing here is a final number yet.

hazard:
  # CLIMADA data API (climada 6.2.0): storm_europe_150arcsec_CHE, v1.2, 150 arcsec (~4.4 km).
  # Footprints from the Copernicus WISC project: 142 historical storms Oct-Mar 1940-2013 + 29 synthetic
  # perturbations each (Schwierz et al. 2010, Clim. Change 101) = 4260 events, freq 1/2190 per year each
  # (sum = 1.95 storms/yr reaching CH). Intensity = peak gust, m/s.
  source: CLIMADA StormEurope / WISC
  dataset_version: v1.2
  region_country: CHE            # Switzerland
  n_sim_years: 10000             # simulated years for the YLT (Poisson occurrence), TODO(M2) justify

exposure:
  # LitPop (Eberenz et al. 2020, ESSD 12): produced capital 2018 (World Bank), split by night lights x
  # population, exponents (1,1), 150 arcsec, 2801 points, total USD 2.36 tn. Only its spatial pattern is used.
  source: CLIMADA LitPop CHE
  litpop_version: v3
  # Rescaled to the building value insured by the 18 cantonal building insurers (VKG media release 2024:
  # "annähernd 2500 Milliarden Franken"). Applied to all of CH as an illustrative market portfolio: it ignores the
  # 8 cantons insured privately (understates the national stock) and contents/BI (property = buildings only).
  total_value_chf: 2.5e12

vulnerability:
  base: schwierz2010             # TODO(M2): confirm CLIMADA's ImpfStormEurope.from_schwierz parameters
  alternative: welker2021        # TODO(M4): confirm ImpfStormEurope.from_welker parameters

layer:                           # TODO(M3): choose attachment/limit from the EP curve, cite as illustrative
  attachment_chf: null
  limit_chf: null
  reinstatements: 1
  reinstatement_rate: 1.0

validation:
  historical_storm: Lothar_1999  # TODO(M4): cite published insured-loss figure for Switzerland
