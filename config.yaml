# Every parameter has a cited source or is flagged ILLUSTRATIVE (a stated assumption, not a sourced value).

hazard:
  # CLIMADA data API (climada 6.2.0): storm_europe_150arcsec_CHE, v1.2, 150 arcsec (~4.4 km).
  # Footprints from the Copernicus WISC project: 142 historical storms Oct-Mar 1940-2013 + 29 synthetic
  # perturbations each (Schwierz et al. 2010, Clim. Change 101) = 4260 events, freq 1/2190 per year each
  # (sum = 1.95 storms/yr reaching CH). Intensity = peak gust, m/s.
  source: CLIMADA StormEurope / WISC
  dataset_version: v1.2
  region_country: CHE            # Switzerland
  n_sim_years: 10000             # simulated years (Poisson). ~50 years exceed the 200-yr loss; the bootstrap CI
                                 # in M4 shows the remaining sampling noise (about +-15% on the 200-yr loss)

exposure:
  # LitPop (Eberenz et al. 2020, ESSD 12): produced capital 2018 (World Bank), split by night lights x
  # population, exponents (1,1), 150 arcsec, 2801 points, total USD 2.36 tn. Only its spatial pattern is used.
  source: CLIMADA LitPop CHE
  litpop_version: v3
  # Rescaled to the building value insured by the 18 cantonal building insurers (VKG media release 2024:
  # "annähernd 2500 Milliarden Franken"). Applied to all of CH as an illustrative market portfolio: it ignores the
  # 8 cantons insured privately (understates the national stock) and contents/BI (property = buildings only).
  total_value_chf: 2.5e12

vulnerability:
  base: schwierz2010             # CLIMADA ImpfStormEurope.from_schwierz (12-point paa x mdd curve, starts at 25 m/s),
                                 # Schwierz et al. 2010; scaled to Lothar (see calibration)
  # Welker et al. 2021 (NHESS 21) is ~1.78 x Schwierz at every gust, so after calibration to Lothar it gives
  # identical results and is no test. M4 instead varies the SHAPE: damage = ((gust - 25) / 35)^n, n = 2, 3, 5,
  # each re-calibrated to Lothar. n = 3 is the cubic law of Klawa & Ulbrich 2003 (NHESS 3); the 25 m/s
  # threshold is where the Schwierz curve starts (a fixed national value, not K&U's local 98th percentile).
  shape_alternatives: [power2, power3, power5]
  bootstrap_resamples: 1000      # years resampled with replacement for the 90% CI on the 200-yr loss

layer:
  # ILLUSTRATIVE per-occurrence cat XL on the calibrated market portfolio, set from the EP curve (not a real
  # treaty): attaches between the 50- and 100-yr OEP loss, exhausts near the 200-yr loss. 1 reinstatement at
  # 100% (paid pro rata capita), the usual cat XL convention.
  attachment_chf: 2.5e+8
  limit_chf: 1.0e+9
  reinstatements: 1
  reinstatement_rate: 1.0

calibration:
  # Lothar, 26 Dec 1999, is the Swiss benchmark storm. Total Swiss damage was about CHF 1.78 bn, mostly forest;
  # building damage was ~CHF 600 m (Blick, "Katastrophen der Schweiz"; PLANAT chronicle gives ~CHF 500 m).
  # Our exposure is buildings, so we calibrate to the building figure, not the Europe-wide EUR 5 bn.
  historical_storm_date: "1999-12-26"
  lothar_building_loss_1999_chf: 6.0e+8
  # Restates the 1999 loss on today's portfolio: construction-cost inflation x growth of the building stock,
  # 1999-2024. ILLUSTRATIVE ASSUMPTION (~+1.8%/yr compound), to be checked against VKG insured-value series.
  trend_factor_to_2024: 1.5

clustering:
  # Storm counts per winter from the 142 historical WISC storms test for clustering (phi = var/mean - 1,
  # Mailier et al. 2006, MWR 134). The stress values are ILLUSTRATIVE: published phi for intense storms over
  # western/central Europe is positive and grows with intensity (Mailier et al. 2006; Pinto et al. 2013,
  # JGR 118), but I have no Swiss-specific estimate, so 0.5 and 1.0 bracket it rather than measure it.
  dispersion_stress: [0.5, 1.0]
  n_sim_years: 100000            # 10x the base run: at 10,000 years the Lothar family alone makes the AAL
                                 # jump by ~8% between seeds, which is the same size as the clustering effect
  damaging_loss_chf: 1.0e+7      # "damaging storm" = modelled loss >= CHF 10 m, for counting multi-storm winters
