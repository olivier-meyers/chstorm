[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chstorm"
version = "0.1.0"
description = "Winter storm risk view for Swiss property with CLIMADA: from hazard to a reinsurance layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # climada (conda-forge) brings numpy, pandas, geopandas, xarray, matplotlib; see README.
    "climada>=5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: bugbear, NPY: numpy rules
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
